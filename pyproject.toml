[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "matrix-vision"
version = "0.1.0"
description = "Data Matrix Code detection and decoding"
requires-python = "<=3.12.13"
dependencies = [
    "numpy",
    "opencv-python",
    "reedsolo",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pillow",
]

[tool.setuptools.packages.find]
include = ["matrixvision*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "benchmark: non-gating comparison vs reference decoders (deselected by default)",
]
